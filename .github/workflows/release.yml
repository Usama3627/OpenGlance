name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version} from tag ${GITHUB_REF_NAME}"

      - name: Install CocoaPods dependencies
        working-directory: iGlance
        run: pod install

      - name: Build universal release
        working-directory: iGlance
        run: |
          xcodebuild \
            -workspace OpenGlance.xcworkspace \
            -scheme OpenGlance \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/OpenGlanceDerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package application
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          app="$RUNNER_TEMP/OpenGlanceDerivedData/Build/Products/Release/OpenGlance.app"
          test -d "$app"
          archive="OpenGlance-v${version}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Generate Sparkle appcast
        id: appcast
        shell: bash
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          archive="OpenGlance-v${version}-macos-universal.zip"
          test -f "$archive"

          # Pass the secret through standard input instead of the Keychain.
          # This is Sparkle's supported non-interactive mode and avoids CI
          # blocking on a Keychain authorization prompt. The private key must
          # match SUPublicEDKey in Info.plist.
          test -n "$SPARKLE_EDDSA_PRIVATE_KEY"

          # generate_appcast reads all *.zip archives from a directory and
          # writes appcast.xml + deltas back into it. Use the CocoaPods build
          # (universal arm64+x86_64); the committed Sparkle/generate_appcast is
          # an older single-arch binary that hangs on the CI runner.
          mkdir -p Sparkle/updates
          cp "$archive" Sparkle/updates/

          printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            iGlance/Pods/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              Sparkle/updates

          # Commit the regenerated appcast + deltas so SUFeedURL serves them.
          git config user.email "noreply@commandcode.ai"
          git config user.name "OpenGlance Bot"
          git add Sparkle/updates
          if ! git diff --cached --quiet; then
            git commit -m "chore: update appcast for v${version}"
            # Tag-triggered Actions checkouts are detached, so push the
            # current commit explicitly to the default branch.
            git push origin HEAD:master
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "${ARCHIVE}.sha256" \
            --title "OpenGlance ${{ steps.version.outputs.version }}" \
            --generate-notes
