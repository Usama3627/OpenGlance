name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version} from tag ${GITHUB_REF_NAME}"

      - name: Install CocoaPods dependencies
        working-directory: iGlance
        run: pod install

      - name: Build Carthage dependencies
        working-directory: iGlance/iGlance
        run: carthage update --platform macOS

      - name: Build universal release
        working-directory: iGlance
        run: |
          xcodebuild \
            -workspace OpenGlance.xcworkspace \
            -scheme OpenGlance \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/OpenGlanceDerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package application
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          app="$RUNNER_TEMP/OpenGlanceDerivedData/Build/Products/Release/OpenGlance.app"
          test -d "$app"
          archive="OpenGlance-v${version}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "${ARCHIVE}.sha256" \
            --title "OpenGlance ${{ steps.version.outputs.version }}" \
            --generate-notes
