name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version} from tag ${GITHUB_REF_NAME}"

      - name: Install CocoaPods dependencies
        working-directory: iGlance
        run: pod install

      - name: Build universal release
        working-directory: iGlance
        run: |
          xcodebuild \
            -workspace OpenGlance.xcworkspace \
            -scheme OpenGlance \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/OpenGlanceDerivedData" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package application
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          app="$RUNNER_TEMP/OpenGlanceDerivedData/Build/Products/Release/OpenGlance.app"
          test -d "$app"
          archive="OpenGlance-v${version}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Generate Sparkle appcast
        id: appcast
        shell: bash
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          archive="OpenGlance-v${version}-macos-universal.zip"
          test -f "$archive"

          # Sparkle's generate_appcast reads the EdDSA private key from the
          # login Keychain, looked up by service "https://sparkle-project.org"
          # and account "ed25519". CI has no Keychain, so we import the secret
          # into a throwaway keychain with those exact attributes. The private
          # key (SPARKLE_EDDSA_PRIVATE_KEY repo secret) must match SUPublicEDKey
          # in Info.plist.
          KEYCHAIN="$RUNNER_TEMP/sparkle.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security add-generic-password \
            -a "ed25519" \
            -s "https://sparkle-project.org" \
            -w "$SPARKLE_EDDSA_PRIVATE_KEY" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          ./Sparkle/generate_appcast \
            --link "https://github.com/Usama3627/OpenGlance/releases/tag/${{ github.ref_name }}" \
            -o Sparkle/updates \
            "$archive"

          # Commit the regenerated appcast + deltas so SUFeedURL serves them.
          git config user.email "noreply@commandcode.ai"
          git config user.name "OpenGlance Bot"
          git add Sparkle/updates
          if ! git diff --cached --quiet; then
            git commit -m "chore: update appcast for v${version}"
            git push origin master
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "${ARCHIVE}.sha256" \
            --title "OpenGlance ${{ steps.version.outputs.version }}" \
            --generate-notes
